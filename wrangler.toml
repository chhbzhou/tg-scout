name = "tg-scout"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 每分钟唤醒一次，到期的定时策略才会真正执行
[triggers]
crons = ["* * * * *"]

# 数据库在首次部署时自动创建，无需手动填写 ID
[[d1_databases]]
binding = "DB"

# 可选：绑定自己的域名（workers.dev 在部分网络下无法访问），取消注释并改成你的域名
# [[routes]]
# pattern = "tg.example.com"
# custom_domain = true
